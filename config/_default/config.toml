[module]
#https://www.thenewdynamic.com/article/hugo-modules-everything-from-imports-to-create/
[[module.imports]]
disable = false
ignoreConfig = false
ignoreImports = false
path = 'github.com/theNewDynamic/gohugo-theme-ananke/v2'

ximage = "https://magic.wizards.com/en/articles/archive/card-preview/memorializing-dominaria-2018-04-04"
[sitemap]
  changefreq = "monthly"
  priority = 0.5
  filename = "sitemap.xml"

[frontmatter]
featured_image = "/images/mtf.jpg"

[cascade]
[cascade.params]
featured_image = "/images/mtf.jpg"

[caches]
  [caches.images]
    dir = ':cacheDir/images'

