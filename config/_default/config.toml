title = "Laurence A. F. Park"
#baseURL = "https://example.com"
#languageCode = "en-us"
locale = "en-us"
#theme = "ananke"

MetaDataFormat = "yaml"
DefaultContentLanguage = "en"
SectionPagesMenu = "main"
pagination.pagerSize = 10
googleAnalytics = ""
enableRobotsTXT = true

#baseURL = "https://staff.cdms.westernsydney.edu.au/~lapark/v2/"
baseURL = "https://lapark.github.io/"
relativeURLs = true
#canonifyURLs = true
canonifyURLs = false

